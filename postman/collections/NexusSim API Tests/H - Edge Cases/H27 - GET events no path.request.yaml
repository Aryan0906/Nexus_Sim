$kind: http-request
name: 'H27 - GET /api/events (no path -> 404)'
order: 3000
method: GET
url: '{{gateway}}/api/events'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('H27 - Expect 404 for missing path segment', () => { pm.response.to.have.status(404); });
      pm.test('H27 - Has error detail', () => {
        const json = pm.response.json();
        pm.expect(json).to.satisfy(j => j.detail !== undefined || j.error !== undefined);
      });
