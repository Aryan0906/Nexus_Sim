$kind: http-request
name: 'J32 - POST /api/auth/login'
order: 4000
method: POST
url: '{{gateway}}/api/auth/login'
headers:
  - key: Content-Type
    value: application/x-www-form-urlencoded
body:
  type: formdata
  content:
    - key: username
      value: admin
      type: text
    - key: password
      value: admin
      type: text
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('J32 - Status 200', () => { pm.response.to.have.status(200); });
      pm.test('J32 - Has access token', () => {
        const json = pm.response.json();
        pm.expect(json).to.have.property('access_token');
        pm.expect(json.token_type).to.eql('bearer');
        pm.expect(json.user.username).to.eql('admin');
      });
      // Store token for subsequent requests
      if (pm.response.code === 200) {
        pm.collectionVariables.set('auth_token', pm.response.json().access_token);
        pm.collectionVariables.set('auth_user', pm.response.json().user.username);
      }
