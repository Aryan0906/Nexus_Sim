$kind: http-request
name: 'J40 - POST /api/auth/login (wrong password)'
order: 4800
method: POST
url: '{{gateway}}/api/auth/login'
headers:
  - key: Content-Type
    value: application/x-www-form-urlencoded
body:
  type: formdata
  formdata:
    - key: username
      value: admin
      type: text
    - key: password
      value: wrongpassword
      type: text
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('J40 - Status 401', () => { pm.response.to.have.status(401); });
