$kind: http-request
name: 'K43 - POST /api/algo/register'
order: 5200
method: POST
url: '{{gateway}}/api/algo/register'
headers:
  - key: Authorization
    value: 'Bearer {{auth_token}}'
  - key: Content-Type
    value: application/x-www-form-urlencoded
body:
  type: formdata
  content:
    - key: algo_id
      value: postman_custom_rl
      type: text
    - key: name
      value: Postman Custom RL
      type: text
    - key: discipline
      value: RL
      type: text
    - key: version
      value: '1.0.0'
      type: text
    - key: onnx_path
      value: s3://models/postman_custom_rl.onnx
      type: text
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('K43 - Status 200 or 409', () => { pm.expect(pm.response.code).to.be.oneOf([200, 409]); });
      pm.test('K43 - Response has expected structure', () => {
        const json = pm.response.json();
        if (pm.response.code === 200) {
          pm.expect(json.status).to.eql('registered');
          pm.expect(json.algo.algo_id).to.eql('postman_custom_rl');
          pm.expect(json.algo.validation_status).to.eql('pending');
          pm.expect(json.algo).to.have.property('name');
          pm.expect(json.algo).to.have.property('discipline');
          pm.expect(json.algo).to.have.property('version');
          pm.collectionVariables.set('registered_algo_id', json.algo.algo_id);
        } else {
          // 409 - already exists, still set the variable for subsequent tests
          pm.collectionVariables.set('registered_algo_id', 'postman_custom_rl');
          pm.expect(json.detail).to.include('already registered');
        }
      });
