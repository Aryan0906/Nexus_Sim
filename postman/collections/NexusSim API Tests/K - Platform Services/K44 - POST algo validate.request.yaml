$kind: http-request
name: 'K44 - POST /api/algo/registry/{id}/validate'
order: 5300
method: POST
url: '{{gateway}}/api/algo/registry/{{registered_algo_id}}/validate'
headers:
  - key: Authorization
    value: 'Bearer {{auth_token}}'
  - key: Content-Type
    value: application/x-www-form-urlencoded
body:
  type: formdata
  content:
    - key: status
      value: validated
      type: text
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('K44 - Status 200 or 404', () => { pm.expect(pm.response.code).to.be.oneOf([200, 404]); });
      if (pm.response.code === 200) {
        pm.test('K44 - Validation updated', () => {
          pm.expect(pm.response.json().validation_status).to.eql('validated');
        });
        pm.test('K44 - status is updated', () => { pm.expect(pm.response.json().status).to.eql('updated'); });
        pm.test('K44 - algo_id matches', () => {
          pm.expect(pm.response.json().algo_id).to.eql(pm.collectionVariables.get('registered_algo_id'));
        });
      }
