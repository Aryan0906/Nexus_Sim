$kind: http-request
name: 'K44 - POST /api/algo/registry/{id}/validate'
order: 5300
method: POST
url: '{{gateway}}/api/algo/registry/{{registered_algo_id}}/validate'
headers:
  - key: Authorization
    value: 'Bearer {{auth_token}}'
  - key: Content-Type
    value: application/x-www-form-urlencoded
body:
  type: formdata
  formdata:
    - key: status
      value: validated
      type: text
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('K44 - Status 200', () => { pm.response.to.have.status(200); });
      pm.test('K44 - Validation updated', () => {
        pm.expect(pm.response.json().validation_status).to.eql('validated');
      });
