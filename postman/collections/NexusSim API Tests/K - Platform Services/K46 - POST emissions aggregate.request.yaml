$kind: http-request
name: 'K46 - POST /api/emissions/aggregate'
order: 5500
method: POST
url: '{{gateway}}/api/emissions/aggregate'
headers:
  - key: Authorization
    value: 'Bearer {{auth_token}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "agents": [
        { "agent_type": "car", "distance_km": 50.0, "idle_minutes": 5.0 },
        { "agent_type": "ev", "distance_km": 50.0, "idle_minutes": 5.0 }
      ]
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('K46 - Status 200', () => { pm.response.to.have.status(200); });
      pm.test('K46 - Aggregates agents', () => {
        const json = pm.response.json();
        pm.expect(json.total_agents).to.eql(2);
        pm.expect(json.total_co2_g).to.be.above(0);
      });
      pm.test('K46 - Has breakdown', () => { pm.expect(pm.response.json()).to.have.property('breakdown'); });
