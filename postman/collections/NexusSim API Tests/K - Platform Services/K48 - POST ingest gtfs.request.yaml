$kind: http-request
name: 'K48 - POST /api/ingest/gtfs'
order: 5700
method: POST
url: '{{gateway}}/api/ingest/gtfs'
headers:
  - key: Authorization
    value: 'Bearer {{auth_token}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "vehicle_id": "V1",
      "route_id": "R1",
      "lat": 19.07,
      "lon": 72.87,
      "speed_kph": 25.0,
      "delay_s": 120
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('K48 - Status 200', () => { pm.response.to.have.status(200); });
      pm.test('K48 - Normalized to nlp.incident', () => {
        const json = pm.response.json();
        pm.expect(json.event.topic).to.eql('nlp.incident');
        pm.expect(json.event.payload.source).to.eql('GTFS-RT');
      });
      pm.test('K48 - Has status', () => { pm.expect(pm.response.json()).to.have.property('status'); });
